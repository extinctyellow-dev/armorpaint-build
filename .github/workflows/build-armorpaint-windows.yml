name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile ArmorPaint
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Clone official ArmorPaint source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/armory3d/armorpaint.git armorpaint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location armorpaint
          $commit = git rev-parse HEAD
          Pop-Location
          $commit | Out-File -Encoding ascii ARMORPAINT_COMMIT.txt
          Write-Host "ArmorPaint commit: $commit"

      - name: Ensure LLVM / clang-cl is available
        shell: pwsh
        run: |
          $clang = "C:\Program Files\LLVM\bin\clang-cl.exe"
          if (-not (Test-Path $clang)) {
            choco install llvm -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio project
        shell: bash
        working-directory: armorpaint/paint
        run: |
          set -e
          ../base/make
          test -f build/ArmorPaint.sln || test -f build/ArmorPaint.vcxproj

      - name: Compile Release x64
        shell: pwsh
        working-directory: armorpaint/paint
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path (Get-Location) "build\ArmorPaint.vcxproj"
          $solution = Join-Path (Get-Location) "build\ArmorPaint.sln"

          if (Test-Path $project) {
            Write-Host "Building $project"
            & msbuild $project /m /p:Configuration=Release /p:Platform=x64 '/p:LLVMInstallDir=C:\Program Files\LLVM' /verbosity:minimal
          }
          elseif (Test-Path $solution) {
            Write-Host "Building $solution"
            & msbuild $solution /m /p:Configuration=Release /p:Platform=x64 '/p:LLVMInstallDir=C:\Program Files\LLVM' /verbosity:minimal
          }
          else {
            throw "ArmorPaint Visual Studio project was not generated."
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ArmorPaint folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = Join-Path $env:GITHUB_WORKSPACE "armorpaint"
          $paint = Join-Path $repo "paint"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\ArmorPaint-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $dataDir = Get-ChildItem -Path (Join-Path $paint "build") -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "data" } |
            Select-Object -First 1

          if (-not $dataDir) {
            throw "Generated ArmorPaint runtime data folder was not found."
          }

          $runtimeDir = $dataDir.Parent.FullName
          Write-Host "Runtime directory: $runtimeDir"
          Copy-Item -Path (Join-Path $runtimeDir "*") -Destination $stage -Recurse -Force

          $exe = Get-ChildItem -Path (Join-Path $paint "build") -File -Recurse -Filter "ArmorPaint.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "Compiled ArmorPaint.exe was not found."
          }

          Write-Host "Executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination (Join-Path $stage "ArmorPaint.exe") -Force

          Copy-Item -Path (Join-Path $repo "license.md") -Destination (Join-Path $stage "license.md") -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "ARMORPAINT_COMMIT.txt") -Destination (Join-Path $stage "ARMORPAINT_COMMIT.txt") -Force

          if (-not (Test-Path (Join-Path $stage "ArmorPaint.exe"))) { throw "Package is missing ArmorPaint.exe." }
          if (-not (Test-Path (Join-Path $stage "data"))) { throw "Package is missing the data folder." }

          Write-Host "Portable package contents:"
          Get-ChildItem -Path $stage | Select-Object Name, Length

      - name: Upload ArmorPaint Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: dist/ArmorPaint-Windows-x64
          if-no-files-found: error
          retention-days: 7
